<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kettle &amp; Crane · Order coffee</title>
    <script>
      // Dark theme before first paint. Only acts if useTheme (src/lib/theme.ts) saw coffee-dark-mode on last visit.
      try {
        if (localStorage.getItem('kc.themeEnabled') === '1') {
          document.documentElement.dataset.theme = localStorage.getItem('kc.theme') === 'dark' ? 'dark' : 'light';
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
