    <title>Kettle &amp; Crane · Order coffee</title>
    <script>
      // Apply the saved theme before first paint so there's no light/dark flash.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('kc.theme') === 'dark' ? 'dark' : 'light';
      } catch (e) {}
    </script>

  </head>

  </body>
